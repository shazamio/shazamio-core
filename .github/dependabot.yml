version: 2

updates:
  # Without this the SHA pins in `ci.yaml` freeze: nothing else in the repository
  #  reads them, so an action stays on whatever commit it was pinned to the day it
  #  was written. Dependabot rewrites both the SHA and the version comment beside it.
  #  `/` reaches `.github/workflows` and a root `action.yml` and nothing deeper, so
  #  the actions we write ourselves are named separately; only `directories` globs.
  #  https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: cargo
    # `/tools` holds the pins of the tools CI installs with `cargo install`.
    directories:
      - /
      - /tools
    # The crates are what the library runs, so a fix in one waits a week rather than
    #  a month. The other ecosystems never change what it computes.
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # `pyo3-async-runtimes` and `pyo3-log` are released against one `pyo3` minor
      #  and both currently require 0.29, while `Cargo.toml` pins two of the three
      #  exactly (`pyo3 = "=0.29.2"`, `pyo3-log = "=0.13.4"`). A pull request moving
      #  one of them alone cannot resolve, so they travel together or not at all.
      pyo3:
        patterns:
          - pyo3
          - pyo3-*

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    # `regenerate.Dockerfile` matches the file pattern too, and a bump of its images
    #  rewrites `tests/data`, which nothing regenerates on a Dependabot branch yet.
    #  https://github.com/dependabot/dependabot-core/blob/c96ebb6ae58f869c275e4e1d220d3bc00cd28be9/docker/lib/dependabot/docker/file_fetcher.rb#L12
    ignore:
      - dependency-name: mwader/static-ffmpeg
      - dependency-name: rust
    # The `manylinux` and `musllinux` images are released together under one date
    #  tag, and the wheels of a release should come out of one of those dates. A name
    #  carries no registry, so `quay.io/` is not part of the pattern.
    #  https://github.com/dependabot/dependabot-core/blob/c96ebb6ae58f869c275e4e1d220d3bc00cd28be9/docker/lib/dependabot/shared/shared_file_parser.rb#L60
    groups:
      pypa:
        patterns:
          - pypa/*

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    # `maturin` is the build backend, not a dependency: the floor in
    #  `build-system.requires` has its reason beside it, and Dependabot raised it to
    #  whatever was newest. `MATURIN_VERSION` in `workflows/ci.yaml` is the pin.
    #  https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated
    ignore:
      - dependency-name: maturin
