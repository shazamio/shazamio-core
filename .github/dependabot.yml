version: 2

updates:
  # Without this the SHA pins in `ci.yaml` freeze: nothing else in the repository
  #  reads them, so an action stays on whatever commit it was pinned to the day it
  #  was written. Dependabot rewrites both the SHA and the version comment beside it.
  #  `/` reaches `.github/workflows` and a root `action.yml` and nothing deeper, so
  #  the actions we write ourselves are named separately; only `directories` globs.
  #  https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    # A release yanked within days of publishing never reaches a pull request.
    #  Dependabot waits 3 days by default; the same 7 every ecosystem below uses.
    #  https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown-
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    # One pull request per ecosystem for every minor and patch bump, which
    #  `workflows/dependabot-auto-merge.yaml` lands once `CI` passes. A major stays in
    #  a pull request of its own, for a person to read.
    #  https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#groups--
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    # `/tools` holds the versions of the tools CI pins.
    directories:
      - /
      - /tools
    # The crates are what the library runs, so a fix in one waits a week rather than
    #  a month. The other ecosystems never change what it computes.
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      # `pyo3-async-runtimes` and `pyo3-log` are released against one `pyo3` minor
      #  and both currently require 0.29, while `Cargo.toml` pins two of the three
      #  exactly (`pyo3 = "=0.29.2"`, `pyo3-log = "=0.13.4"`). A pull request moving
      #  one of them alone cannot resolve, so they travel together or not at all.
      pyo3:
        patterns:
          - pyo3
          - pyo3-*
      # A dependency lands in the first group it matches, so `pyo3` stays above.
      crates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      hooks:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    # `regenerate.Dockerfile` matches the file pattern too, and a bump of its images
    #  rewrites `tests/data`, which `workflows/dependabot-regenerate.yaml` commits.
    #  https://github.com/dependabot/dependabot-core/blob/c96ebb6ae58f869c275e4e1d220d3bc00cd28be9/docker/lib/dependabot/docker/file_fetcher.rb#L12
    # The `manylinux` and `musllinux` images are released together under one date
    #  tag, and the wheels of a release should come out of one of those dates. A name
    #  carries no registry, so `quay.io/` is not part of the pattern.
    #  https://github.com/dependabot/dependabot-core/blob/c96ebb6ae58f869c275e4e1d220d3bc00cd28be9/docker/lib/dependabot/shared/shared_file_parser.rb#L60
    groups:
      pypa:
        patterns:
          - pypa/*
      # The images `tests/data` is generated in. A bump of them is committed with
      #  the regenerated data, which `Fixtures` then compares with itself, so `CI`
      #  passing proves nothing and the auto-merge workflow skips this group.
      regenerate:
        patterns:
          - mwader/static-ffmpeg
          - rust

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # `maturin` is the build backend, not a dependency: the floor in
    #  `build-system.requires` has its reason beside it, and Dependabot raised it to
    #  whatever was newest. The pin is in `tools/Cargo.toml`, under the `cargo` entry.
    #  https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated
    ignore:
      - dependency-name: maturin
