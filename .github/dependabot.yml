version: 2

updates:
  # Without this the SHA pins in `ci.yaml` freeze: nothing else in the repository
  #  reads them, so an action stays on whatever commit it was pinned to the day it
  #  was written. Dependabot rewrites both the SHA and the version comment beside it.
  #  `/` reaches `.github/workflows` and a root `action.yml` and nothing deeper, so
  #  the actions we write ourselves are named separately; only `directories` globs.
  #  https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#directories-or-directory--
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    groups:
      # `pyo3-async-runtimes` and `pyo3-log` are released against one `pyo3` minor
      #  and both currently require 0.29, while `Cargo.toml` pins two of the three
      #  exactly (`pyo3 = "=0.29.2"`, `pyo3-log = "=0.13.4"`). A pull request moving
      #  one of them alone cannot resolve, so they travel together or not at all.
      pyo3:
        patterns:
          - pyo3
          - pyo3-*

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    # `maturin` is the build backend, not a dependency: the floor in
    #  `build-system.requires` has its reason beside it, and Dependabot raised it to
    #  whatever was newest. `MATURIN_VERSION` in `workflows/ci.yaml` is the pin.
    #  https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/controlling-dependencies-updated
    ignore:
      - dependency-name: maturin
