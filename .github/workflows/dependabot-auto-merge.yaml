name: Dependabot auto-merge

# A minor or patch Dependabot bump lands by itself once `CI` passes. Auto-merge only
#  queues the merge, and the `master` ruleset requiring the `CI` check is what holds
#  it until then. Without that rule, or with "Allow auto-merge" off in the repository
#  settings, the step fails and nothing merges.
#  https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/automate-dependabot-with-actions#enabling-automerge-on-a-pull-request
on:
  pull_request:
    branches:
      - "master"

# Runs triggered by Dependabot get a read-only token, and a `permissions` key is
#  what raises it.
#  https://docs.github.com/en/code-security/dependabot/troubleshooting-dependabot/troubleshooting-dependabot-on-github-actions#changing-github_token-permissions
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Queue the merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      # `update-type` is the highest bump in the pull request, so one major inside a
      #  group keeps the whole group for a person to read.
      #  https://github.com/dependabot/fetch-metadata/blob/25dd0e34f4fe68f24cc83900b1fe3fe149efef98/README.md?plain=1#L66-L67
      - name: Read what the pull request bumps
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # A bump of a `regenerate.Dockerfile` image, grouped or not, is queued by
      #  `dependabot-regenerate.yaml` instead, which alone sees whether the regenerated
      #  files moved a golden URI. A moved golden URI waits for a person on any bump,
      #  since `Fixtures` compares it with itself.
      - name: Read what the pull request changes
        id: changes
        run: |
          files=$(gh pr diff "$PR_NUMBER" --name-only)
          if grep --quiet --line-regexp 'docker/regenerate.Dockerfile' <<< "$files"; then
            echo "regenerate=true" >> "$GITHUB_OUTPUT"
          fi

          if grep --quiet '^tests/data/.*\.uri$' <<< "$files"; then
            echo "moved-uri=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

      # A major can break what `CI` never runs: the `release` job runs on a tag only.
      - name: Queue the merge until `CI` passes
        if: >-
          steps.changes.outputs.regenerate != 'true'
          && steps.changes.outputs.moved-uri != 'true'
          && (steps.metadata.outputs.update-type == 'version-update:semver-minor'
          || steps.metadata.outputs.update-type == 'version-update:semver-patch')
        uses: ./.github/actions/auto-merge
        with:
          enabled: true
