name: shazamio-core CI

on:
  workflow_dispatch:
  # `pull_request` builds the branch merged with `master` as it stood when the run
  #  started, so two branches that are each green can still land a tree nobody ever
  #  compiled -- which is how `d743ebb` reached `master` failing `cargo test` with
  #  `error[E0308]: mismatched types`. Only a run on the merged result catches that.
  push:
    branches:
      - "master"
      - "dev"
    tags:
      - "*"
  pull_request:
    branches:
      - "master"
      - "dev"

# Every `uses:` below is pinned to a commit SHA, with its version in the comment
#  beside it. A tag is mutable: whoever owns the action can move `v7` onto another
#  commit, and it then runs with the `contents: write` granted here and with the
#  PyPI token the `release` job passes in. Dependabot keeps the pins current --
#  see `.github/dependabot.yml`.
#  https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
permissions:
  contents: write
  pages: write
  id-token: write

# The one place the built-with version is stated. `maturin-action` installs the
#  latest release unless told otherwise, and the manylinux images take this as a
#  build argument, so without it the Linux wheels and the macOS/Windows wheels of
#  one release come out of different `maturin` versions.
env:
  MATURIN_VERSION: v1.14.1

# Every command below lives in the `justfile`, so a local check and a CI job are one
#  string rather than two copies that drift. Four jobs need `just`, so getting it is
#  a local composite action rather than four copies of the same two commands:
#  `.github/actions/setup-just`.

jobs:
  # A `paths:` filter on the trigger skips the whole workflow, and a required check
  #  belonging to a run that never happened stays pending forever. A job skipped by
  #  `if:` reports `skipped`, which counts as success, so the gate lives here.
  #  https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The workflow grants three scopes, which sets every other one to `none`, and
      #  this action reads the pull request's file list through the API.
      #  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md#L23
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.rust == 'true' }}
      python: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.python == 'true' }}
      dist: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.dist == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag push carries no diff to filter on, and `workflow_dispatch` is somebody
      #  asking for the whole matrix. The step then does not run and leaves its
      #  outputs empty, which the three above read as `true`.
      - id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yaml

  # Builds its own wheel rather than taking one from `linux`: the goldens are a claim
  #  about the algorithm, and the claim has to hold on every platform the wheels
  #  target. `release` waits on this job, so a changed fingerprint stops a publish.
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: ./.github/actions/setup-just

      - name: Install the project and its test dependencies
        run: just sync

      - name: Run the tests
        run: just test

      # The stub does not vary by platform, so one runner answers for all three. Why
      #  the check exists at all: the `stubtest` recipe.
      - name: Check the type stub against the built extension
        if: matrix.os == 'ubuntu-latest'
        run: just stubtest

  # Byte layout, checksum, band ordering: none of that varies by platform, so one
  #  runner answers for all of them -- whether the fingerprint itself does is what
  #  the job above exists for.
  rust-test:
    name: Rust unit tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test binary is an executable rather than an extension module, so it
      #  links `libpython` instead of borrowing the loader's symbols, and needs an
      #  interpreter built `--enable-shared`, which is what this action ships.
      #  https://github.com/actions/python-versions/blob/c2033aa6c313f068f4bde238bfaa5987ad4f2e79/builders/ubuntu-python-builder.psm1#L37
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: ./.github/actions/setup-just

      - name: Run the unit tests
        run: just rust-test

  # Neither of the two gates the recipe runs is provided by anything else here: the
  #  wheel jobs compile the crate, and a compiler is indifferent to formatting and to
  #  every lint `clippy` adds on top of it. `clippy` runs at its own default level
  #  rather than with a curated lint set: it is a gate against new findings, not a
  #  rewrite of code that predates it.
  lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: rustup component add rustfmt clippy

      - uses: ./.github/actions/setup-just

      - name: Check the formatting and run `clippy`
        run: just lint

  # The wheels below are abi3: one per platform, loading on every CPython from 3.10
  #  up. There is no per-interpreter matrix any more, so a new CPython release
  #  needs no change here and no new release. The floor lives in `Cargo.toml`.
  windows:
   needs: changes
   if: needs.changes.outputs.dist == 'true'
   runs-on: windows-latest
   strategy:
     matrix:
       target: [ x64, x86 ]
   steps:
     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     # The version is deliberately unpinned: under abi3 the wheel is the same
     # whichever CPython builds it, and a pinned one would need editing again the
     # day it goes end-of-life. The step itself has to stay for the x86 target --
     # pyo3 does not treat 32-bit-on-64-bit Windows as cross-compilation, so it
     # reads the host interpreter's config and needs a 32-bit one to be present.
     # https://github.com/PyO3/pyo3/blob/v0.29.2/pyo3-build-config/src/impl_.rs#L1675-L1679
     - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
       with:
         python-version: "3.x"
         architecture: ${{ matrix.target }}
     - name: Build wheels
       uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
       with:
         maturin-version: ${{ env.MATURIN_VERSION }}
         target: ${{ matrix.target }}
         args: --release --out dist
         sccache: "true"
     - name: Upload wheels
       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
       with:
         name: wheels-${{ runner.os }}-${{ matrix.target }}
         path: dist
#
  macos:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  linux:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    strategy:
      matrix:
        include:
          - docker_file: docker/Dockerfile.manylinux_2_28_ARM64
            name: manylinux-arm
            arch: aarch64
            os: ubuntu-24.04-arm
          - docker_file: docker/Dockerfile.manylinux_2_28_X64
            os: ubuntu-latest
            name: manylinux-x86
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ${{ matrix.docker_file }}
          platforms: ${{ matrix.arch }}
          build-args: |
            MATURIN_VERSION=${{ env.MATURIN_VERSION }}
          tags: shazamio_core
          push: false
          load: true
          # Both matrix entries share the buildx default scope otherwise, so the
          #  repository holds one index and whichever job finishes last on `master`
          #  overwrites the other's. One run measured 12 cached layers on x86 against 0
          #  on ARM64, and 8.72 GB of blobs behind four surviving indexes.
          #  https://github.com/moby/buildkit/blob/703866e5f2e4af295b485b181b447a7755d5099c/README.md#L544
          cache-from: type=gha,scope=${{ matrix.name }}
          # A pull request's cache is scoped to `refs/pull/N/merge`, which neither `master`
          #  nor another pull request can read, so each one exported a full image of layers
          #  nobody could reuse. That held the repository over the 10 GB limit, and eviction
          #  is oldest-first, so the x86 image lost its layers before the next run read them
          #  -- 0 cached layers, and 224s of a 441s build step spent re-exporting them.
          #  https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0}', matrix.name) || '' }}
          context: .

      - name: List /opt/dist directory
        run: docker run --rm shazamio_core ls -la /opt/dist

      - name: Copy wheels
        run: docker run --rm -v $(pwd)/dist:/tmp shazamio_core sh -c "cp -R /opt/dist/* /tmp/"

      - name: Debug List files in /tmp after copy
        run: ls -la dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The build image carries every library the wheel could have linked against;
      #  this runner carries none of them, and it is the same architecture the wheel
      #  targets. Installing here is what proves the wheel works where users are --
      #  nothing else in this workflow ever runs what it publishes.
      #  `--find-links` rather than a glob: `dist/` holds the PyPy wheel as well, and
      #  naming both on one `pip install` fails as unsupported on this interpreter.
      #  Resolving by name also fails if the wheel carries the wrong platform tags.
      - name: Check the wheel installs and imports outside the build image
        run: |
          pip install --no-index --find-links dist shazamio_core

          # `python -c` puts the working directory first on `sys.path`, so from the
          #  repository root this imported `shazamio_core/` out of the source tree
          #  instead of the wheel just installed -- and passed, for as long as that
          #  directory held a Python stub next to the extension. `$RUNNER_TEMP` keeps
          #  the source tree off the path, so the import can only resolve to the wheel.
          cd "$RUNNER_TEMP"
          python -c "import shazamio_core; print(shazamio_core.__file__)"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os }}-${{ matrix.name }}
          path: dist

  sdist:
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  # `rust-version` in `Cargo.toml` is a claim nothing else checks, because every
  #  other job installs current stable. Why that matters: the `msrv` recipe.
  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-just

      - name: Check the crate against the declared MSRV
        run: just msrv

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    needs: [ test, rust-test, lint, sdist, macos, linux, windows ]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: upload
          args: --skip-existing dist/*

      - name: Attach Artifacts to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
