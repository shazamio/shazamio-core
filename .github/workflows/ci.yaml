name: shazamio-core CI

on:
  workflow_dispatch:

  # `pull_request` builds the branch merged with `master` as it stood when the run
  #  started, so two branches that are each green can still land a tree nobody ever
  #  compiled, which is how `d743ebb` reached `master` failing `cargo test` with
  #  `error[E0308]: mismatched types`. Only a run on the merged result catches that.
  push:
    branches:
      - "master"
      - "dev"

    tags:
      - "*"

  pull_request:
    branches:
      - "master"
      - "dev"

# Every `uses:` below is pinned to a commit SHA, with its version in the comment
#  beside it. A tag is mutable: whoever owns the action can move `v7` onto another
#  commit, and it then runs with whatever scopes its own job holds and, in
#  `release`, beside the PyPI token that job passes in. Dependabot keeps the pins
#  current, see `.github/dependabot.yml`.
#  https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

# Read-only, so the one job that writes asks for the scope itself and no other job
#  holds it. Naming any scope at all sets every unnamed one to `none`, which is why
#  this single line is the whole grant rather than an addition to a default.
#  https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#permissions
permissions:
  contents: read

# Every command below lives in the `justfile`, so a local check and a CI job are one
#  string rather than two copies that drift. Most jobs need `just`, so getting it is
#  a local composite action rather than one copy of the same two commands per job:
#  `.github/actions/setup-just`.
jobs:
  # A `paths:` filter on the trigger skips the whole workflow, and a required check
  #  belonging to a run that never happened stays pending forever. A job skipped by
  #  `if:` reports `skipped`, which counts as success, so the gate lives here.
  #  https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/collaborating-on-repositories-with-code-quality-features/troubleshooting-required-status-checks
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read

      # The workflow grants `contents` alone, which leaves every other scope at
      #  `none`, and this action reads the pull request's file list through the API.
      #  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md?plain=1#L23
      pull-requests: read

    outputs:
      rust: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.rust == 'true' }}
      python: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.python == 'true' }}
      dist: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.dist == 'true' }}
      licenses: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.licenses == 'true' }}
      fixtures: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.fixtures == 'true' }}
      harness_lint: ${{ steps.filter.outcome == 'skipped' || steps.filter.outputs.harness_lint == 'true' }}
      maturin: ${{ steps.pins.outputs.maturin }}
      abi3-python: ${{ steps.pins.outputs.abi3-python }}
      abi3t-python: ${{ steps.pins.outputs.abi3t-python }}
      free-threaded-python: ${{ steps.pins.outputs.free-threaded-python }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read once and handed to every job that builds or uploads a wheel.
      #  `maturin-action` falls back to the floor in `build-system.requires`, which
      #  resolves to the newest release, and the manylinux images take it as a build
      #  argument; without one version the wheels of a release mix `maturin` versions.
      #  https://github.com/PyO3/maturin-action/blob/e83996d129638aa358a18fbd1dfb82f0b0fb5d3b/src/index.ts#L482-L505
      #
      # The macOS and Windows jobs build on three interpreters: the floors of the
      #  `abi3-py*` and `abi3t-py*` features in `Cargo.toml`, and 3.14t, older than
      #  `abi3t`, argued there. `docker/build-wheels.sh` names the same free-threaded
      #  ones for Linux; keep the two in sync. Outputs rather than a workflow `env`,
      #  because the `test` matrix reads them, and a matrix cannot see `env`.
      #  https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#context-availability
      - id: pins
        run: |
          {
            echo "maturin=$(sed -n 's/^maturin = "=\(.*\)"$/\1/p' tools/Cargo.toml)"
            echo "abi3-python=$(sed -n 's/.*"abi3-py3\([0-9]*\)".*/3.\1/p' Cargo.toml)"
            echo "abi3t-python=$(sed -n 's/.*"abi3t-py3\([0-9]*\)".*/3.\1t/p' Cargo.toml)"
            echo "free-threaded-python=3.14t"
          } >> "$GITHUB_OUTPUT"

      # A tag push carries no diff to filter on, and `workflow_dispatch` is somebody
      #  asking for the whole matrix. The step then does not run and leaves its
      #  outputs empty, which every output above reads as `true`.
      - id: filter
        if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/path-filters.yaml

  # Builds its own wheel rather than taking one from `linux`: the goldens are a claim
  #  about the algorithm, and the claim has to hold on every platform the wheels
  #  target. `release` waits on this job, so a changed fingerprint stops a publish.
  #
  # Every platform runs the `abi3` floor: a newer interpreter builds `abi3t`, argued
  #  above `pyo3` in `Cargo.toml`, and leaves the binary of the `abi3` wheel untested.
  #  The free-threaded legs run the suite with the GIL off, where a thread-safety bug
  #  in the extension shows; the decoder and resampler do not vary by platform there,
  #  so one runner holds them.
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python: [ "${{ needs.changes.outputs.abi3-python }}" ]
        include:
          - os: ubuntu-latest
            python: ${{ needs.changes.outputs.free-threaded-python }}

          - os: ubuntu-latest
            python: ${{ needs.changes.outputs.abi3t-python }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: ./.github/actions/setup-just

      # Why `UV_PYTHON` is set: the comment above that check in `scripts/smoketest_dist.py`.
      - name: Install the project and its test dependencies
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: just install-test

      - name: Run the tests
        env:
          UV_PYTHON: ${{ steps.python.outputs.python-path }}
        run: just test-python

      # The stub does not vary by platform, so one runner answers for all three. Why
      #  the check exists at all: the `typecheck` recipe.
      - name: Check the type stub against the built extension
        if: matrix.os == 'ubuntu-latest' && matrix.python == needs.changes.outputs.abi3-python
        run: just typecheck

  # Byte layout, checksum, band ordering: none of that varies by platform, so one
  #  runner answers for all of them. Whether the fingerprint itself does is what the
  #  job above exists for.
  rust-test:
    name: Rust unit tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test binary is an executable rather than an extension module, so it
      #  links `libpython` instead of borrowing the loader's symbols, and needs an
      #  interpreter built `--enable-shared`, which is what this action ships.
      #  https://github.com/actions/python-versions/blob/c2033aa6c313f068f4bde238bfaa5987ad4f2e79/builders/ubuntu-python-builder.psm1#L37
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - uses: ./.github/actions/setup-just

      - name: Run the unit tests
        run: just test-rust

  # Neither of the two gates the recipe runs is provided by anything else here: the
  #  wheel jobs compile the crate, and a compiler is indifferent to formatting and to
  #  every lint `clippy` adds on top of it. `clippy` runs at its own default level
  #  rather than with a curated lint set: it is a gate against new findings, not a
  #  rewrite of code that predates it.
  lint:
    name: Rust lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup component add rustfmt clippy
      - uses: ./.github/actions/setup-just

      - name: Check the formatting and run `clippy`
        run: just lint-rust

  # The shell nothing else here reads: the scripts the images run, and the `run:`
  #  blocks of this file, which no compiler ever sees. `actionlint` checks the
  #  workflow around them as well, so a matrix key that does not exist fails here
  #  instead of expanding to an empty string in a later job.
  harness-lint:
    name: Harness lint
    needs: changes
    if: needs.changes.outputs.harness_lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-just

      - name: Lint the scripts and the workflows
        run: just lint-harness

  # `licenses/about.toml` restates the targets the three jobs below build for,
  #  because `cargo about` resolves the dependency tree per target and cannot read
  #  a workflow. Adding a target here means adding it there.

  # Every job below emits three CPython wheels: `abi3` for every GIL build from its
  #  floor up, `abi3t` for every free-threaded build from 3.15 up, and one for 3.14t,
  #  which predates `abi3t`. A new CPython release needs no change here and no new
  #  release. Both floors live in `Cargo.toml`; `dist-check` refuses a set missing one.
  windows:
    name: Wheel (windows ${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [ x64, x86 ]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The interpreter decides which wheel is built, argued above `pyo3` in `Cargo.toml`,
      #  so each is named. They match the target for x86: pyo3 does not treat 32-bit-on-64-bit Windows
      #  as cross-compilation, so it reads the interpreter's config.
      #  https://github.com/PyO3/pyo3/blob/a70d17f898df41b3d1632ee987f624f5222d8d39/pyo3-build-config/src/impl_.rs#L1675-L1679
      - id: abi3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.abi3-python }}
          architecture: ${{ matrix.target }}

      - id: free-threaded
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.free-threaded-python }}
          architecture: ${{ matrix.target }}
          update-environment: false

      - id: abi3t
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.abi3t-python }}
          architecture: ${{ matrix.target }}
          update-environment: false

      # One build per interpreter: given all three at once, `maturin` 1.16.0 built the
      #  floor a `cp311-cp311` wheel instead of `abi3`, which `dist-check` refuses.
      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.abi3.outputs.python-path }}
          sccache: "true"

      - name: Build the 3.14t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.free-threaded.outputs.python-path }}
          sccache: "true"

      - name: Build the abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.abi3t.outputs.python-path }}
          sccache: "true"

      - uses: ./.github/actions/setup-just

      - name: Check what the wheels carry
        run: just dist-check

      - name: Check the wheels install and import outside the checkout
        shell: bash
        env:
          FREE_THREADED: ${{ steps.free-threaded.outputs.python-path }}
          ABI3T: ${{ steps.abi3t.outputs.python-path }}
        run: |
          just dist-smoketest
          UV_PYTHON="$FREE_THREADED" just dist-smoketest
          UV_PYTHON="$ABI3T" just dist-smoketest

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.target }}
          path: dist

  macos:
    name: Wheel (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Why each interpreter is named: the `windows` job.
      - id: abi3
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.abi3-python }}

      - id: free-threaded
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.free-threaded-python }}
          update-environment: false

      - id: abi3t
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.changes.outputs.abi3t-python }}
          update-environment: false

      - name: Build the abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.abi3.outputs.python-path }}
          sccache: "true"

      - name: Build the 3.14t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.free-threaded.outputs.python-path }}
          sccache: "true"

      - name: Build the abi3t wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter ${{ steps.abi3t.outputs.python-path }}
          sccache: "true"

      - uses: ./.github/actions/setup-just

      - name: Check what the wheels carry
        run: just dist-check

      - name: Check the wheels install and import outside the checkout
        env:
          FREE_THREADED: ${{ steps.free-threaded.outputs.python-path }}
          ABI3T: ${{ steps.abi3t.outputs.python-path }}
        run: |
          just dist-smoketest
          UV_PYTHON="$FREE_THREADED" just dist-smoketest
          UV_PYTHON="$ABI3T" just dist-smoketest

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  linux:
    name: Wheel (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    strategy:
      matrix:
        include:
          - name: manylinux-arm
            arch: aarch64
            os: ubuntu-24.04-arm
            base: manylinux
            smoketest: dist-smoketest

          - name: manylinux-x86
            arch: x86_64
            os: ubuntu-latest
            base: manylinux
            smoketest: dist-smoketest

          # A musl system matches neither `manylinux` tag, so an install on one built
          #  the crate from source instead: a Rust toolchain and a C compiler first,
          #  then the `libopus` that `opus` bundles. Alpine is the common case.
          - name: musllinux-arm
            arch: aarch64
            os: ubuntu-24.04-arm
            base: musllinux
            smoketest: dist-smoketest-musl

          - name: musllinux-x86
            arch: x86_64
            os: ubuntu-latest
            base: musllinux
            smoketest: dist-smoketest-musl

          # No hosted runner is riscv64, so both legs build and smoketest under QEMU.
          #  `manylinux_2_39` is the stage named for it in `docker/Dockerfile`.
          - name: manylinux-riscv64
            arch: riscv64
            os: ubuntu-latest
            base: manylinux_2_39
            smoketest: dist-smoketest-riscv64 gnu

          # `uv` downloads no CPython for musl riscv64, so the free-threaded wheels
          #  run under the build image's own interpreters instead.
          - name: musllinux-riscv64
            arch: riscv64
            os: ubuntu-latest
            base: musllinux
            smoketest: dist-smoketest-riscv64 musl
            free-threaded-smoketest: dist-smoketest-riscv64-musl-free-threaded

    # The emulated riscv64 legs took 64 and 70 minutes on hosted runners; the cap stops
    #  a hung emulator from holding the required check for the default 360.
    #  https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idtimeout-minutes
    timeout-minutes: ${{ matrix.arch == 'riscv64' && 120 || 360 }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        if: matrix.arch == 'riscv64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: riscv64

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          file: docker/Dockerfile
          platforms: ${{ matrix.arch }}

          # The `Dockerfile` declares both arguments and defaults neither, so a tag
          #  that drifts from what is published here fails the build instead.
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            MATURIN_VERSION=${{ needs.changes.outputs.maturin }}

          tags: shazamio_core
          push: false
          load: true

          # The matrix entries share the buildx default scope otherwise, so the
          #  repository holds one index and whichever job finishes last on `master`
          #  overwrites the others'. One run measured 12 cached layers on x86 against 0
          #  on ARM64, and 8.72 GB of blobs behind four surviving indexes.
          #  https://github.com/moby/buildkit/blob/703866e5f2e4af295b485b181b447a7755d5099c/README.md?plain=1#L544
          cache-from: type=gha,scope=${{ matrix.name }}

          # A pull request's cache is scoped to `refs/pull/N/merge`, which neither `master`
          #  nor another pull request can read, so each one exported a full image of layers
          #  nobody could reuse. That held the repository over the 10 GB limit, and eviction
          #  is oldest-first, so the x86 image lost its layers before the next run read
          #  them: 0 cached layers, and 224s of a 441s build step spent re-exporting them.
          #  Six scopes divide that same limit now, and the two libcs share no layer.
          #  https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching
          #
          # A failed export only costs the next run its cache, yet it failed the step after
          #  the wheels were built: `error writing layer blob: not_found`.
          #  https://github.com/moby/buildkit/blob/19f31ff5bb57ee8b81ad0c8ef9a80e16447df0e6/README.md?plain=1#L567
          cache-to: ${{ github.ref == 'refs/heads/master' && format('type=gha,mode=max,scope={0},ignore-error=true', matrix.name) || '' }}
          context: .

      # An ignored export error stays only in the build record, so a cache that stops
      #  being written would show as nothing but slower builds. A failed export logs
      #  `#7 ERROR: error writing layer blob: ...` there and exits 0.
      - name: Warn when the cache export failed
        if: github.ref == 'refs/heads/master'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          ref=$(jq -r '."buildx.build.ref" | split("/") | last' <<< "$METADATA")
          if ! logs=$(docker buildx history logs "$ref" 2>&1); then
            echo "::warning title=Cache export not checked (${{ matrix.name }})::$logs"
            exit 0
          fi

          # The `gha` exporter's step name, which no other exporter shares.
          #  https://github.com/moby/buildkit/blob/9734cd037bcf5d8f15740ed250e9b7c53d4d9137/cache/remotecache/gha/gha.go#L172-L174
          vertex=$(grep -oE '^#[0-9]+ exporting to GitHub Actions Cache$' <<< "$logs" | cut -d ' ' -f 1 | head -n 1)
          if [[ -z "$vertex" ]]; then
            echo "::warning title=Cache export not checked (${{ matrix.name }})::no cache export step in the build record"
            exit 0
          fi

          error=$(grep -m 1 "^$vertex ERROR: " <<< "$logs" || true)
          if [[ -n "$error" ]]; then
            echo "::warning title=Cache export failed (${{ matrix.name }})::${error#"$vertex ERROR: "}"
          fi

      - name: Copy the wheels out of the image
        run: docker run --rm -v "$(pwd)/dist:/tmp" shazamio_core sh -c "cp -R /opt/dist/* /tmp/"

      - uses: ./.github/actions/setup-just

      - name: Check what the wheels carry
        run: just dist-check

      # The build image carries every library the wheel could have linked against
      #  and this runner carries none of them, at the architecture the wheel
      #  targets. That is what makes the Linux copy of this step the one that
      #  proves the wheel works where users are. A musl wheel cannot be installed
      #  on the runner at all, so its recipe runs the same script inside Alpine.
      #  `uv` downloads each free-threaded interpreter, which this runner lacks.
      - name: Check the wheels install and import outside the checkout
        env:
          FREE_THREADED: ${{ needs.changes.outputs.free-threaded-python }}
          ABI3T: ${{ needs.changes.outputs.abi3t-python }}
        run: |
          just ${{ matrix.smoketest }}
          if [[ -n "${{ matrix.free-threaded-smoketest }}" ]]; then
            just ${{ matrix.free-threaded-smoketest }}
          else
            UV_PYTHON="$FREE_THREADED" just ${{ matrix.smoketest }}
            UV_PYTHON="$ABI3T" just ${{ matrix.smoketest }}
          fi

      # The musl and `manylinux_2_39` images ship no PyPy.
      - name: Check each PyPy wheel installs and imports under its own PyPy
        if: matrix.base == 'manylinux'
        run: just dist-smoketest-pypy

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ runner.os }}-${{ matrix.name }}
          path: dist

  sdist:
    name: Source distribution
    needs: changes
    if: needs.changes.outputs.dist == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          command: sdist
          args: --out dist

      - uses: ./.github/actions/setup-just

      - name: Check what the archive carries
        run: just dist-check

      # The registry and not `target/`, and written only from `master`: both are the
      #  10 GB cache limit this repository has already gone over once, which the
      #  `cache-to` line of the `linux` job argues. A pull request would export a
      #  release `target/` nothing else can read, and it is the largest thing here.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Nothing else opens the archive, and it is the install path wherever no wheel
      #  exists. `install-test` compiles the crate through the PEP 517 backend, so an
      #  `include` that dropped a source file or a fixture fails here instead of in
      #  somebody's terminal. It resolves without `uv.lock`, which the archive omits.
      - name: Check a wheel builds out of the archive and its suite passes
        run: |
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/shazamio_core-*

          just install-test
          just test-python

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-sdist
          path: dist

  # `rust-version` in `Cargo.toml` is a claim nothing else checks, because every
  #  other job installs current stable. Why that matters: the `msrv` recipe.
  msrv:
    name: MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-just

      - name: Check the crate against the declared MSRV
        run: just msrv

  # `THIRD-PARTY-NOTICES.md` ships in every wheel and is generated from
  #  `Cargo.lock`, so the failure worth catching is a dependency change nobody
  #  regenerated after. Why the notices exist at all: `licenses/about.toml`.
  licenses:
    name: Licence notices
    needs: changes
    if: needs.changes.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-cargo-about

      - name: Check the notices still match `Cargo.lock`
        run: just licenses-check

  fixtures:
    name: Fixtures
    needs: changes
    if: needs.changes.outputs.fixtures == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-just

      - name: Check `tests/data` is what `just regenerate` writes
        run: just regenerate-check

  # Branch protection matches a required check by name, and a skipped matrix job
  #  reports its `name:` unexpanded instead of one check per leg: one skipped
  #  `Wheel (${{ matrix.name }})` where a run reports `Wheel (manylinux-arm)` and
  #  five more. No matrix name is safe to require, so this one is static and
  #  reports whatever the filters decided.
  gate:
    name: CI
    needs: [ changes, test, rust-test, lint, harness-lint, msrv, windows, macos, linux, sdist, licenses, fixtures ]

    # Runs even when everything it waits on was filtered away, which is the case it
    #  exists for: a documentation-only pull request must report this name too.
    if: always()
    runs-on: ubuntu-latest
    steps:
      # `skipped` is a pass, `failure` and `cancelled` are not. A step that runs
      #  only on the bad case needs no condition of its own to succeed otherwise.
      - name: Fail unless everything succeeded or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  # Not `needs: gate`: that job passes when a dependency was skipped, which is what
  #  makes it requireable, and a skipped wheel job must never let a publish through.
  #  `msrv` is in the list because the floor is a promise the published crate makes:
  #  everything else builds with current stable, so a dependency that raised the
  #  real floor fails here and nowhere before the first person on that version.
  release:
    name: Release
    needs: [ changes, test, rust-test, lint, harness-lint, msrv, windows, macos, linux, sdist, licenses ]

    # Tags only: a manual run of a branch would upload its version to PyPI and
    #  create a release named after the branch, since `tag_name` falls back to the
    #  ref name. A manual run started on a tag still has a `refs/tags/` ref.
    #  https://github.com/softprops/action-gh-release/blob/efb35369e0ad2afab669f228072c1b0d510eae64/README.md?plain=1#L227
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # The only write in the workflow: `action-gh-release` attaches the wheels to the
    #  tag's release through the API. The upload to PyPI needs nothing here, it
    #  authenticates with a token of its own.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      # A tag on a tree whose `Cargo.toml` still holds the previous version builds
      #  files of that version: `--skip-existing` skips them as already on PyPI, the
      #  run goes green, and the GitHub release names a version never published. The
      #  files are what ships, so their names are what is compared, the sdist included.
      - name: Refuse files not versioned as the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          status=0
          for path in dist/*; do
            name=$(basename "$path")
            version=${name#*-}
            version=${version%%-*}
            version=${version%.tar.gz}
            if [ "$version" != "$TAG" ]; then
              echo "::error::$name is version $version, the tag is $TAG"
              status=1
            fi
          done
          exit "$status"

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ needs.changes.outputs.maturin }}
          command: upload
          args: --skip-existing dist/*

      - name: Attach Artifacts to the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
