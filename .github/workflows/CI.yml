name: shazamio-core CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - '*'
  pull_request:
    branches:
      - 'master'
      - 'dev'

# Every `uses:` below is pinned to a commit SHA, with its version in the comment
#  beside it. A tag is mutable: whoever owns the action can move `v7` onto another
#  commit, and it then runs with the `contents: write` granted here and with the
#  PyPI token the `release` job passes in. Dependabot keeps the pins current --
#  see `.github/dependabot.yml`.
#  https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
permissions:
  contents: write
  pages: write
  id-token: write

# `maturin-action` installs the latest release unless told otherwise, so without
# this the Linux wheels and the macOS/Windows wheels of one release come out of
# different `maturin` versions. Must match `maturin==` in `docker/Dockerfile.manylinux_2_28_*`.
env:
  MATURIN_VERSION: v1.14.1

jobs:
  # The wheels below are abi3: one per platform, loading on every CPython from 3.9
  # up. There is no per-interpreter matrix any more, so a new CPython release
  # needs no change here and no new release.
  windows:
   runs-on: windows-latest
   strategy:
     matrix:
       target: [ x64, x86 ]
   steps:
     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     # The version is deliberately unpinned: under abi3 the wheel is the same
     # whichever CPython builds it, and a pinned one would need editing again the
     # day it goes end-of-life. The step itself has to stay for the x86 target --
     # pyo3 does not treat 32-bit-on-64-bit Windows as cross-compilation, so it
     # reads the host interpreter's config and needs a 32-bit one to be present.
     # https://github.com/PyO3/pyo3/blob/v0.29.2/pyo3-build-config/src/impl_.rs#L1675-L1679
     - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
       with:
         python-version: "3.x"
         architecture: ${{ matrix.target }}
     - name: Build wheels
       uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
       with:
         maturin-version: ${{ env.MATURIN_VERSION }}
         target: ${{ matrix.target }}
         args: --release --out dist
         sccache: 'true'
     - name: Upload wheels
       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
       with:
         name: wheels-${{ runner.os }}-${{ matrix.target }}
         path: dist
#
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  linux:
    strategy:
      matrix:
        include:
          - docker_file: docker/Dockerfile.manylinux_2_28_ARM64
            name: manylinux-arm
            arch: aarch64
            os: ubuntu-24.04-arm
          - docker_file: docker/Dockerfile.manylinux_2_28_X64
            os: ubuntu-latest
            name: manylinux-x86
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ${{ matrix.docker_file }}
          platforms: ${{ matrix.arch }}
          tags: shazamio_core
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .

      - name: List /opt/dist directory
        run: docker run --rm shazamio_core ls -la /opt/dist

      - name: Copy wheels
        run: docker run --rm -v $(pwd)/dist:/tmp shazamio_core sh -c "cp -R /opt/dist/* /tmp/"

      - name: Debug List files in /tmp after copy
        run: ls -la dist

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os }}-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    needs: [ sdist, macos, linux, windows ]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: upload
          args: --skip-existing dist/*

      - name: Attach Artifacts to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
