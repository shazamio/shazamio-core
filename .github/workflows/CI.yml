name: shazamio-core CI

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - '*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # The wheels below are abi3: one per platform, loading on every CPython from 3.9
  # up. There is no per-interpreter matrix any more, so a new CPython release
  # needs no change here and no new release.
  windows:
   runs-on: windows-latest
   strategy:
     matrix:
       target: [ x64, x86 ]
   steps:
     - uses: actions/checkout@v3
     # The version is deliberately unpinned: under abi3 the wheel is the same
     # whichever CPython builds it, and a pinned one would need editing again the
     # day it goes end-of-life. The step itself has to stay for the x86 target --
     # pyo3 does not treat 32-bit-on-64-bit Windows as cross-compilation, so it
     # reads the host interpreter's config and needs a 32-bit one to be present.
     # https://github.com/PyO3/pyo3/blob/v0.29.2/pyo3-build-config/src/impl_.rs#L1675-L1679
     - uses: actions/setup-python@v4
       with:
         python-version: "3.x"
         architecture: ${{ matrix.target }}
     - name: Build wheels
       uses: PyO3/maturin-action@v1
       with:
         target: ${{ matrix.target }}
         args: --release --out dist
         sccache: 'true'
     - name: Upload wheels
       uses: actions/upload-artifact@v4
       with:
         name: wheels-${{ runner.os }}-${{ matrix.target }}
         path: dist
#
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  linux:
    strategy:
      matrix:
        include:
          - docker_file: docker/Dockerfile.manylinux_2_28_ARM64
            name: manylinux-arm
            arch: aarch64
            os: ubuntu-22.04-arm
          - docker_file: docker/Dockerfile.manylinux_2_28_X64
            os: ubuntu-latest
            name: manylinux-x86
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v5
        with:
          file: ${{ matrix.docker_file }}
          platforms: ${{ matrix.arch }}
          tags: shazamio_core
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .

      - name: List /opt/dist directory
        run: docker run --rm shazamio_core ls -la /opt/dist

      - name: Copy wheels
        run: docker run --rm -v $(pwd)/dist:/tmp shazamio_core sh -c "cp -R /opt/dist/* /tmp/"

      - name: Debug List files in /tmp after copy
        run: ls -la dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ runner.os }}-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    needs: [ sdist, macos, linux, windows ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --skip-existing dist/*

      - name: Attach Artifacts to the release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
