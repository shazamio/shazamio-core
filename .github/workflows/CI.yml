name: shazamio-core CI

on:
  workflow_dispatch:
  # `pull_request` builds the branch merged with `master` as it stood when the run
  #  started, so two branches that are each green can still land a tree nobody ever
  #  compiled -- which is how `d743ebb` reached `master` failing `cargo test` with
  #  `error[E0308]: mismatched types`. Only a run on the merged result catches that.
  push:
    branches:
      - 'master'
      - 'dev'
    tags:
      - '*'
  pull_request:
    branches:
      - 'master'
      - 'dev'

# Every `uses:` below is pinned to a commit SHA, with its version in the comment
#  beside it. A tag is mutable: whoever owns the action can move `v7` onto another
#  commit, and it then runs with the `contents: write` granted here and with the
#  PyPI token the `release` job passes in. Dependabot keeps the pins current --
#  see `.github/dependabot.yml`.
#  https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
permissions:
  contents: write
  pages: write
  id-token: write

# `maturin-action` installs the latest release unless told otherwise, so without
# this the Linux wheels and the macOS/Windows wheels of one release come out of
# different `maturin` versions. Must match `maturin==` in `docker/Dockerfile.manylinux_2_28_*`.
env:
  MATURIN_VERSION: v1.14.1

jobs:
  # Builds its own wheel rather than taking one from `linux`: the goldens are a claim
  #  about the algorithm, and the claim has to hold on every platform the wheels
  #  target. `release` waits on this job, so a changed fingerprint stops a publish.
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install the extension and the test dependencies
        run: pip install . pytest pytest-asyncio

      # `pytest`, never `python -m pytest`: the latter puts the repository root on
      #  `sys.path`, where `shazamio_core/shazamio_core.py` shadows the extension just
      #  installed. `tests/conftest.py` fails loudly if that happens anyway.
      - name: Run the tests
        run: pytest

  # Byte layout, checksum, band ordering: none of that varies by platform, so one
  #  runner answers for all of them -- whether the fingerprint itself does is what
  #  the job above exists for.
  rust-test:
    name: Rust unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test binary is an executable rather than an extension module, so it
      #  links `libpython` instead of borrowing the loader's symbols, and needs an
      #  interpreter built `--enable-shared` -- which is what this action ships.
      #  https://github.com/actions/python-versions/blob/c2033aa6c313f068f4bde238bfaa5987ad4f2e79/builders/ubuntu-python-builder.psm1#L37
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Run the unit tests
        run: cargo test

  # The wheels below are abi3: one per platform, loading on every CPython from 3.9
  # up. There is no per-interpreter matrix any more, so a new CPython release
  # needs no change here and no new release.
  windows:
   runs-on: windows-latest
   strategy:
     matrix:
       target: [ x64, x86 ]
   steps:
     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     # The version is deliberately unpinned: under abi3 the wheel is the same
     # whichever CPython builds it, and a pinned one would need editing again the
     # day it goes end-of-life. The step itself has to stay for the x86 target --
     # pyo3 does not treat 32-bit-on-64-bit Windows as cross-compilation, so it
     # reads the host interpreter's config and needs a 32-bit one to be present.
     # https://github.com/PyO3/pyo3/blob/v0.29.2/pyo3-build-config/src/impl_.rs#L1675-L1679
     - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
       with:
         python-version: "3.x"
         architecture: ${{ matrix.target }}
     - name: Build wheels
       uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
       with:
         maturin-version: ${{ env.MATURIN_VERSION }}
         target: ${{ matrix.target }}
         args: --release --out dist
         sccache: 'true'
     - name: Upload wheels
       uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
       with:
         name: wheels-${{ runner.os }}-${{ matrix.target }}
         path: dist
#
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          args: --release --out dist
          sccache: 'true'
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  linux:
    strategy:
      matrix:
        include:
          - docker_file: docker/Dockerfile.manylinux_2_28_ARM64
            name: manylinux-arm
            arch: aarch64
            os: ubuntu-24.04-arm
          - docker_file: docker/Dockerfile.manylinux_2_28_X64
            os: ubuntu-latest
            name: manylinux-x86
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          file: ${{ matrix.docker_file }}
          platforms: ${{ matrix.arch }}
          tags: shazamio_core
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .

      - name: List /opt/dist directory
        run: docker run --rm shazamio_core ls -la /opt/dist

      - name: Copy wheels
        run: docker run --rm -v $(pwd)/dist:/tmp shazamio_core sh -c "cp -R /opt/dist/* /tmp/"

      - name: Debug List files in /tmp after copy
        run: ls -la dist

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # The build image carries every library the wheel could have linked against;
      #  this runner carries none of them, and it is the same architecture the wheel
      #  targets. Installing here is what proves the wheel works where users are --
      #  nothing else in this workflow ever runs what it publishes.
      #  `--find-links` rather than a glob: `dist/` holds the PyPy wheel as well, and
      #  naming both on one `pip install` fails as unsupported on this interpreter.
      #  Resolving by name also fails if the wheel carries the wrong platform tags.
      - name: Check the wheel installs and imports outside the build image
        run: |
          pip install --no-index --find-links dist shazamio_core
          python -c "import shazamio_core; print(shazamio_core.__file__)"

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ runner.os }}-${{ matrix.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  # `rust-version` in `Cargo.toml` is a claim nothing else checks: every other job
  # installs current stable, so a `cargo update` can raise the real floor and stay
  # green. Whoever builds the sdist on a distro toolchain is the one who finds out.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Read from `Cargo.toml` rather than restated here: a second copy would drift
      # and leave the job checking a floor the crate no longer declares.
      - name: Read the declared MSRV
        id: declared
        run: echo "version=$(grep -oP '^rust-version = "\K[^"]+' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - run: rustup toolchain install ${{ steps.declared.outputs.version }} --profile minimal

      - run: cargo +${{ steps.declared.outputs.version }} check --locked --all-targets

  release:
    name: Release
    runs-on: ubuntu-latest
    if: "startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'"
    needs: [ test, rust-test, sdist, macos, linux, windows ]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: upload
          args: --skip-existing dist/*

      - name: Attach Artifacts to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
