# Which paths gate which check. `.github/workflows/ci.yaml` reads these outputs;
#  `.pre-commit-config.yaml` restates the same sets as `re` patterns, because
#  neither format can read the other.
#  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md#L115

# Whatever decides is in every set below: a change to the workflow, to this file
#  or to a recipe runs the whole matrix, rather than the part an older decision
#  happened to select.
harness: &harness
  - .github/workflows/ci.yaml
  - .github/actions/**
  - .github/path-filters.yaml
  - justfile

# An alias to a list nests it, and this action flattens that at any depth, so an
#  anchor composed of other anchors is read as one flat list of patterns.
#  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/src/filter.ts#L155-L157

# What the dependency tree is resolved from, and so what the licence notices are
#  generated from. Named apart from `crate` below because `src/**` cannot change
#  which crates the wheel links.
manifest: &manifest
  - Cargo.toml
  - Cargo.lock

crate: &crate
  - src/**
  - *manifest

# The notices, and the two files they are generated from. An anchor because both
#  sets below name all three: `licenses` regenerates them, `dist` ships them.
notices: &notices
  - licenses/**
  - THIRD-PARTY-NOTICES.md

# `Rust lint`, `Rust unit tests` and `MSRV`. `tests/**` is in the set because the
#  unit tests read their fixtures from there: `DATA_DIRECTORY` in
#  `src/fingerprinting/algorithm.rs` points at `tests/data`.
rust:
  - *harness
  - *crate
  - tests/**

# `Test`, which runs `just test-python` and `just typecheck`. The crate is in scope
#  because both exercise the built extension rather than the sources beside it.
python:
  - *harness
  - *crate
  - tests/**
  - shazamio_core/**
  - pyproject.toml
  - uv.lock

# `windows`, `macos`, `linux` and `sdist`, which build what a release publishes and
#  check what came out of it. Everything `scripts/check_dist.py` names is in the set:
#  the stub and `py.typed`, `LICENSE`, the notices, `licenses/`, `tests/*.py` and the
#  script itself, plus the `README.md` that `twine check` renders. Globbed where
#  `include` in `Cargo.toml` names one file: that decides what is published, this
#  only decides what re-runs, and too narrow here skips a job in silence.
dist:
  - *harness
  - *crate
  - pyproject.toml
  - docker/**
  - shazamio_core/**
  - scripts/**
  - tests/**
  - README.md
  - LICENSE
  - *notices

# `Licence notices`, which regenerates them and diffs against the committed file.
licenses:
  - *harness
  - *manifest
  - *notices

# `Harness lint`, which `shellcheck`s the scripts and `actionlint`s the workflows.
#  The workflows arrive with `harness`; the glob mirrors the `git ls-files` the
#  recipe feeds `shellcheck`, and `**` collapses to nothing, so a script added
#  anywhere is in the set.
#  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/__tests__/filter.test.ts#L61-L64
harness_lint:
  - *harness
  - "**/*.sh"
  - scripts/check_ci_gate.py
