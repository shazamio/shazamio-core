# Which paths gate which check. `.github/workflows/ci.yaml` reads these outputs;
#  `.pre-commit-config.yaml` restates the same sets as `re` patterns, because
#  neither format can read the other.
#  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/README.md#L115

# Whatever decides is in every set below: a change to the workflow, to this file
#  or to a recipe runs the whole matrix, rather than the part an older decision
#  happened to select.
harness: &harness
  - .github/workflows/ci.yaml
  - .github/actions/**
  - .github/path-filters.yaml
  - justfile

# An alias to a list nests it, and this action flattens that at any depth, so an
#  anchor composed of other anchors is read as one flat list of patterns.
#  https://github.com/dorny/paths-filter/blob/ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d/src/filter.ts#L155-L157

# What the dependency tree is resolved from, and so what the licence notices are
#  generated from. Named apart from `crate` below because `src/**` cannot change
#  which crates the wheel links.
manifest: &manifest
  - Cargo.toml
  - Cargo.lock

crate: &crate
  - src/**
  - *manifest

# `Rust lint`, `Rust unit tests` and `MSRV`.
rust:
  - *harness
  - *crate

# `Test`, which runs `just test-python` and `just typecheck`. The crate is in scope
#  because both exercise the built extension rather than the sources beside it.
python:
  - *harness
  - *crate
  - tests/**
  - shazamio_core/**
  - pyproject.toml
  - uv.lock

# `windows`, `macos`, `linux` and `sdist`, which build what a release publishes and
#  check what came out of it. The notices are in that set: `pyproject.toml` ships
#  them beside `LICENSE`, so editing them changes what every wheel contains. So are
#  the package directory and the checker itself: `dist-check` requires the stub and
#  `py.typed`, and a deletion there would otherwise reach a release unchecked.
dist:
  - *harness
  - *crate
  - pyproject.toml
  - docker/**
  - shazamio_core/**
  - scripts/**
  - THIRD-PARTY-NOTICES.md

# `Licence notices`, which regenerates them and diffs against the committed file.
licenses:
  - *harness
  - *manifest
  - licenses/**
  - THIRD-PARTY-NOTICES.md
