name: Set up `cargo-about`
description: Install `just` and the `cargo-about` version the `justfile` names.

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-just

    # The version is the `justfile`'s, read rather than restated: a generator of
    #  another version rewrites the notices, and the two copies would then
    #  disagree about which output is the correct one.
    - id: tool
      shell: bash
      run: echo "version=$(just _pin cargo-about)" >> "$GITHUB_OUTPUT"

    # A prebuilt binary from the project's own releases. Building it from source
    #  costs about half a minute of the job for a check that runs in seconds.
    - uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
      with:
        tool: cargo-about@${{ steps.tool.outputs.version }}
