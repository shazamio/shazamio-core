# Never built. The tools CI installs with `cargo install`, named as dependencies so
#  the `cargo` entry of `.github/dependabot.yml` bumps them: no Dependabot ecosystem
#  reads a version out of a `justfile`. The `justfile` reads each one from here.
[package]
name = "tools"
version = "0.0.0"
edition = "2021"
publish = false

# A package needs a target before `cargo` reads its manifest at all.
[lib]
path = "lib.rs"

[dependencies]
# Exact: another version rewrites `THIRD-PARTY-NOTICES.md` and turns a green branch
#  red with nobody having touched the tree.
cargo-about = "=0.9.2"
