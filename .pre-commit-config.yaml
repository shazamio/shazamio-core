repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-ast
      - id: debug-statements
      - id: name-tests-test
        args: [--pytest-test-first]

  # Each hook runs the recipe its namesake job in `.github/workflows/ci.yaml` runs,
  #  over the same paths: the sets of `.github/path-filters.yaml`, which neither
  #  format can read from the other, and which is where each set is argued.

  # Deliberately not identical to that file: each config lists whatever decides for
  #  it, so the workflow carries `.github/**` and this one carries itself.
  - repo: local
    hooks:
      - id: lint-rust
        name: rust · fmt and clippy
        entry: just
        args: [lint-rust]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|src/.*|Cargo\.(toml|lock)|tests/.*)$
        pass_filenames: false

      - id: test-rust
        name: rust · unit tests
        entry: just
        args: [test-rust]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|src/.*|Cargo\.(toml|lock)|tests/.*)$
        pass_filenames: false

      # On the lockfile as well as on the crate: what a `cargo update` can do to
      #  the floor is argued above the `msrv` recipe.
      - id: msrv
        name: rust · check against the declared MSRV
        entry: just
        args: [msrv]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|src/.*|Cargo\.(toml|lock)|tests/.*)$
        pass_filenames: false

      # The crate is in scope for both because they exercise the built extension;
      #  `tool.uv.cache-keys` in `pyproject.toml` is what rebuilds it.
      - id: test-python
        name: python · pytest
        entry: just
        args: [test-python]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|src/.*|Cargo\.(toml|lock)|tests/.*|shazamio_core/.*|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: typecheck
        name: python · stub against the built extension
        entry: just
        args: [typecheck]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|src/.*|Cargo\.(toml|lock)|tests/.*|shazamio_core/.*|pyproject\.toml|uv\.lock)$
        pass_filenames: false

      - id: licenses
        name: licences · notices against `Cargo.lock`
        entry: just
        args: [licenses-check]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|Cargo\.(toml|lock)|licenses/.*|THIRD-PARTY-NOTICES\.md|tools/.*)$
        pass_filenames: false

      # `.github/**` is the linted content here rather than a decider, so unlike
      #  every set above it is in this one.
      - id: lint-harness
        name: harness · `shellcheck`, `actionlint`, the gate and the filters
        entry: just
        args: [lint-harness]
        language: system
        files: ^(\.pre-commit-config\.yaml|justfile|pyproject\.toml|uv\.lock|\.github/.*|.*\.sh|scripts/check_(ci_gate|ci_filters|dependabot)\.py)$
        pass_filenames: false

      # Replaces `check-vcs-permalinks`, whose ref pattern excludes dots, so a tag
      #  such as `v0.29.2` passed it. A line anchor into a rendered file (Markdown,
      #  reStructuredText, AsciiDoc, Org) also needs `?plain=1`, or GitHub drops
      #  the anchor.
      #  https://github.com/pre-commit/pre-commit-hooks/blob/3e8a8703264a2f4a69428a0aa4dcb512790b2c8c/pre_commit_hooks/check_vcs_permalinks.py#L11-L14
      #  https://docs.github.com/en/get-started/writing-on-github/working-with-advanced-formatting/creating-a-permanent-link-to-a-code-snippet#linking-to-markdown
      - id: github-permalinks
        name: links · GitHub links pin a commit, rendered-file anchors carry `?plain=1`
        entry: 'github\.com/[^/\s]+/[^/\s]+/(blob|tree|blame|raw)/(?![0-9a-fA-F]{40}(?![0-9A-Za-z]))|raw\.githubusercontent\.com/[^/\s]+/[^/\s]+/(?![0-9a-fA-F]{40}/)|github\.com/\S+\.(?i:md|markdown|mdx|rst|adoc|asciidoc|org)#L'
        language: pygrep
        types: [text]
