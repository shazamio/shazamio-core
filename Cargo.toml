[package]
name = "shazamio-core"
version = "1.2.0"
edition = "2021"
# `rodio` 0.22 declares 1.87; nothing here needs more.
rust-version = "1.87"

[lib]
name = "shazamio_core"
crate-type = ["cdylib", "lib"]


[dependencies]
tokio = { version = "1.43.0" }
tempfile = "3.16.0"
# `default-features = false` drops `playback`, which is the only thing that pulls
# `cpal` and therefore `alsa-sys`. This crate decodes audio, it never plays it, so
# the build no longer needs ALSA headers on Linux. Possible only from 0.21 on:
# 0.20.1 declares `cpal` as a plain dependency, so no feature flag can remove it.
# https://github.com/RustAudio/rodio/blob/v0.20.1/Cargo.toml#L13
# The feature list restates 0.22's own defaults minus `playback`, `recording` and
# `dither`. https://github.com/RustAudio/rodio/blob/v0.22.2/Cargo.toml#L15-L23
rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "vorbis", "wav"] }
serde_json = "1.0.138"
blocking = { version = "1.5.1", features = [] }
byteorder = "1.5.0"
crc32fast = "1.4.2"
base64 = { version = "0.22.1", features = [] }
chfft = {version = "0.3.4"}
futures = { version = "0.3.31", features = [] }
serde = { version = "1.0.217", features = ["derive"] }
bytes = "1.10.0"
# `abi3-py39` builds one wheel per platform that loads on every CPython from 3.9
# up, instead of one wheel per interpreter version. A new CPython release then
# needs no new wheel and no release at all -- which is what 3.13 and 3.14 each
# needed under the old layout.
pyo3 = { version = "=0.29.2", features = ["abi3-py39"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pyo3-log = "=0.13.4"
log = "0.4.20"

[features]
default = ["pyo3/extension-module"]
