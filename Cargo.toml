[package]
name = "shazamio-core"
version = "1.2.0"
edition = "2021"
# `rubato` 5 declares 1.87 and is the highest floor in the tree; `pyo3` 0.29 asks for
#  1.83 and nothing else asks for more.
rust-version = "1.87"

[lib]
name = "shazamio_core"
crate-type = ["cdylib", "lib"]


[dependencies]
tokio = { version = "1.53.1" }
serde_json = "1.0.151"
blocking = { version = "1.6.2", features = [] }
byteorder = "1.5.0"
crc32fast = "1.5.0"
base64 = { version = "0.23.1", features = [] }
chfft = {version = "0.3.4"}
futures = { version = "0.3.34", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.12.1"
# `abi3-py310` builds one wheel per platform that loads on every CPython from 3.10
#  up, so 3.13 and 3.14 needed no wheel of their own, as they did under the old
#  layout. 3.9 is past end of life, and `pyproject.toml` states the same floor.
#  https://devguide.python.org/versions/
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pyo3-log = "=0.13.4"
log = "0.4.33"
# `symphonia` ships no Opus decoder in any release up to 0.6.1, its latest, and
#  `features = ["all"]` adds none: `symphonia-codec-opus` is unwritten and unpublished.
#  `opus` bundles `libopus` and links it statically, so the wheel gains no dependency.
#  https://github.com/pdeljanov/Symphonia/blob/ee35874b571a35a9a6e15d3bc9a3aaf8f11fbeee/README.md#L111
symphonia = { version = "0.5.4", features = ["all"] }
opus = "0.4.0"
rubato = "5.0.0"

[profile.release]
# Measured 2026-09-05 by diffing the CI wheels before and after. On Linux the
#  extension loses 23% against 1.8% for `"debuginfo"`, on macOS 21%, and on Windows
#  nothing: its debug information sits in a `.pdb` that no wheel carried.
#  https://doc.rust-lang.org/cargo/reference/profiles.html#strip
strip = "symbols"
