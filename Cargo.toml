[package]
name = "shazamio-core"
version = "1.2.0"
edition = "2021"
# The one copy: `pyproject.toml` lists `description` in `dynamic` and `maturin`
#  takes it from here, where it becomes the `Summary` of the Python distribution.
description = "Audio fingerprinting for Shazam, written in Rust and exposed to Python"
# Without one of `documentation`, `homepage` or `repository` every build prints
#  `manifest has no documentation, homepage or repository`. `[project.urls]` names
#  this address again because `cargo` has no field for an issue tracker, and making
#  `urls` dynamic too would drop that link from the distribution metadata.
repository = "https://github.com/shazamio/shazamio-core"
# Nothing publishes this crate: the wheel is what ships. `licenses/about.toml` reads
#  the field to keep our own licence out of the third-party notices.
publish = false
# Same expression `pyproject.toml` declares. It is here because the licence
#  harvesting the `licenses` recipe runs reads crate metadata, and warns on
#  every run about a crate that declares none.
license = "MIT"
# `rubato` 5 declares 1.87 and is the highest floor in the tree; `pyo3` 0.29 asks for
#  1.83 and nothing else asks for more.
rust-version = "1.87"
# What the source distribution carries, whitelisted so a new file has to be named
#  here to ship. It leaves out what only the repository uses: the workflows, the
#  wheel image, the commit hooks, the lock file of the test tooling. The tests and
#  their audio stay, because a source build is the install path wherever no wheel
#  exists and whoever takes it has to run the suite on the platform they built for.
#  https://packaging.python.org/en/latest/discussions/downstream-packaging/
#  `Cargo.toml`, `Cargo.lock` and `pyproject.toml` are added by the build regardless.
#
#  Every pattern is anchored because `include` overrides `.gitignore`: a bare
#  `LICENSE` matched the 54 of them under `.venv/` and `.pytest_cache/` too.
#  https://doc.rust-lang.org/cargo/reference/manifest.html#the-exclude-and-include-fields
include = [
    # The crate, and the Python package the built extension is loaded from.
    "/src/**/*.rs",
    "/shazamio_core/**",
    "/tests/**",
    # How the suite above is run, and the one record of what a source build should
    #  pass before it is trusted.
    "/justfile",
    # Removing it fails the build before the compiler is reached: `Failed to read
    #  Readme specified in Cargo.toml, which should be at <root>/README.md`.
    "/README.md",
    # Both are named in `license-files` in `pyproject.toml`, so they carry into the
    #  metadata of the wheel a source build produces.
    "/LICENSE",
    "/THIRD-PARTY-NOTICES.md",
    # The generator of the notices above, and what the shipped `justfile` reads in
    #  `licenses-check`: without it that recipe and `ci` fail on a missing file.
    "/licenses/**",
]

[lib]
name = "shazamio_core"
crate-type = ["cdylib", "lib"]


[dependencies]
tokio = { version = "1.53.1" }
serde_json = "1.0.151"
blocking = { version = "1.6.2", features = [] }
byteorder = "1.5.0"
crc32fast = "1.5.0"
base64 = { version = "0.23.1", features = [] }
chfft = {version = "0.3.4"}
futures = { version = "0.3.34", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.12.1"
# `abi3-py310` builds one wheel per platform that loads on every CPython from 3.10
#  up, so 3.13 and 3.14 needed no wheel of their own, as they did under the old
#  layout. 3.9 is past end of life, and `pyproject.toml` states the same floor.
#  https://devguide.python.org/versions/
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pyo3-log = "=0.13.4"
log = "0.4.33"
# `symphonia` ships no Opus decoder in any release up to 0.6.1, its latest, and
#  `features = ["all"]` adds none: `symphonia-codec-opus` is unwritten and unpublished.
#  `opus` bundles `libopus` and links it statically, so the wheel gains no dependency.
#  https://github.com/pdeljanov/Symphonia/blob/ee35874b571a35a9a6e15d3bc9a3aaf8f11fbeee/README.md#L111
symphonia = { version = "0.5.4", features = ["all"] }
opus = "0.4.0"
rubato = "5.0.0"

[profile.release]
# Measured 2026-09-05 by diffing the CI wheels before and after. On Linux the
#  extension loses 23% against 1.8% for `"debuginfo"`, on macOS 21%, and on Windows
#  nothing: its debug information sits in a `.pdb` that no wheel carried.
#  https://doc.rust-lang.org/cargo/reference/profiles.html#strip
strip = "symbols"
