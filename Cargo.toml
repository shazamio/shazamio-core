[package]
name = "shazamio-core"
version = "1.2.0"
edition = "2021"
# `rubato` 5 declares 1.87 and is the highest floor in the tree; `pyo3` 0.29 asks for
#  1.83 and nothing else asks for more.
rust-version = "1.87"

[lib]
name = "shazamio_core"
crate-type = ["cdylib", "lib"]


[dependencies]
tokio = { version = "1.53.1" }
serde_json = "1.0.151"
blocking = { version = "1.6.2", features = [] }
byteorder = "1.5.0"
crc32fast = "1.5.0"
base64 = { version = "0.23.1", features = [] }
chfft = {version = "0.3.4"}
futures = { version = "0.3.34", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.12.1"
# `abi3-py310` builds one wheel per platform that loads on every CPython from 3.10
#  up, instead of one wheel per interpreter version. A new CPython release then
#  needs no new wheel and no release at all -- which is what 3.13 and 3.14 each
#  needed under the old layout.
#  3.9 went end-of-life in October 2025, so nothing is left to build for below 3.10.
#  https://devguide.python.org/versions/
#  `requires-python` in `pyproject.toml` states the same floor for `pip`.
pyo3 = { version = "=0.29.2", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pyo3-log = "=0.13.4"
log = "0.4.33"
# `symphonia` has no Opus decoder in any release, and no `symphonia-codec-opus`
#  crate exists, so `features = ["all"]` does not add one either. `opus` bundles
#  `libopus` and links it statically, so the wheel gains no runtime dependency.
#  https://github.com/pdeljanov/Symphonia#codecs-decoders
symphonia = { version = "0.5.4", features = ["all"] }
opus = "0.4.0"
rubato = "5.0.0"

[profile.release]
# Measured 2026-09-05 by diffing the CI wheels before and after. On Linux the
#  extension loses 23% against 1.8% for `"debuginfo"`, on macOS 21%, and on Windows
#  nothing: its debug information sits in a `.pdb` that no wheel carried.
#  https://doc.rust-lang.org/cargo/reference/profiles.html#strip
strip = "symbols"
